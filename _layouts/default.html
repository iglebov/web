<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}en{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta name="theme-color" content="#182b3a">
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
            } catch (error) {}
        })();
    </script>
    {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
</head>
<body>
    {% include header.html %}
    <main id="main-content" class="container{% if page.section == 'home' %} page-home{% endif %}">
        {{ content }}
    </main>
    {% include footer.html %}
    <script>
        (function () {
            var button = document.querySelector('.theme-toggle');
            if (!button) return;
            var icon = button.querySelector('.theme-toggle__icon');
            var isRussian = document.documentElement.lang === 'ru';
            function update(dark) {
                button.setAttribute('aria-pressed', dark ? 'true' : 'false');
                button.setAttribute('aria-label', dark
                    ? (isRussian ? 'Включить светлую тему' : 'Enable light theme')
                    : (isRussian ? 'Включить тёмную тему' : 'Enable dark theme'));
                icon.textContent = dark ? '☀' : '☾';
            }
            var dark = document.documentElement.dataset.theme === 'dark';
            update(dark);
            button.addEventListener('click', function () {
                dark = !dark;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (error) {}
                update(dark);
            });
        })();
    </script>
</body>
</html>
